packages:
  - apps/*
  - packages/*
  - tests/browser

# pnpm 12 ignores ignore-scripts in .npmrc for install; this is the setting it honours.
ignoreScripts: true

# Install fails on a Node other than the engines pin. A different pnpm hands over to the
# packageManager pin by itself.
engineStrict: true

# geist ships the font files and a next/font helper that peers on Next.js. Only the font
# files are used (packages/ui/scripts/fonts.mjs), so Next.js is an optional peer here and
# is never installed.
packageExtensions:
  geist:
    peerDependenciesMeta:
      next:
        optional: true

catalog:
  '@axe-core/playwright': 4.14.0
  '@playwright/test': 1.64.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  geist: 1.8.2
  # Story 1.21, reviewed: generates packages/api-client's types from docs/api/openapi-v1.json.
  # Dev only: nothing it brings reaches a bundle.
  openapi-typescript: 7.13.0
  # @axe-core/playwright peers on playwright-core: pinned to the version @playwright/test uses.
  playwright-core: 1.64.1
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 7.0.2
  vite: 8.3.5
  yaml: 2.9.1

catalogs:
  # openapi-typescript drives the TypeScript 5 compiler API, which TypeScript 7 doesn't ship, so
  # packages/api-client alone has the last TypeScript 5 for it. Everything else compiles with 7.
  openapi:
    typescript: 5.9.3
