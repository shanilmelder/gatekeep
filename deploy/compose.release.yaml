# Gatekeep from a signed release (Story 12.5): an overlay on compose.yaml that runs every
# Gatekeep image by the digest named in deploy/release.env, never built here and never by
# tag. docs/install.md "Install a signed release" has the steps; in short:
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.release.yaml \
#     --env-file deploy/release.env --profile release run --rm release-verify
#   docker compose -f deploy/compose.yaml -f deploy/compose.release.yaml \
#     --env-file deploy/release.env up -d --wait
#
# release.env is published with each release and holds only GATEKEEP_<SVC>_IMAGE lines,
# each <repository>@sha256:<digest>. Every one is required: Compose refuses to start if
# any is missing, rather than fall back to a local build.
#
# release-verify checks each digest's signature and signed SBOM against the public key
# pinned on the Docker host, ${GATEKEEP_TRUST_DIR:-./trust}/release-signing.pub, resolved
# against deploy/. That directory is never a Docker volume, never committed and never in
# an image; only release-verify mounts the key, read-only. Besides Caddy's edge network,
# it is the only service with egress, on the registry network, which exists only in this
# overlay, to reach the registry.

x-release-image: &release-image
  build: !reset null
  pull_policy: missing

services:
  openbao:
    <<: *release-image
    image: ${GATEKEEP_OPENBAO_IMAGE:?missing, pass --env-file deploy/release.env}

  hosted:
    <<: *release-image
    image: ${GATEKEEP_HOSTED_IMAGE:?missing, pass --env-file deploy/release.env}

  admin:
    <<: *release-image
    image: ${GATEKEEP_ADMIN_IMAGE:?missing, pass --env-file deploy/release.env}

  worker:
    <<: *release-image
    image: ${GATEKEEP_WORKER_IMAGE:?missing, pass --env-file deploy/release.env}

  caddy:
    <<: *release-image
    image: ${GATEKEEP_CADDY_IMAGE:?missing, pass --env-file deploy/release.env}

  cli:
    <<: *release-image
    image: ${GATEKEEP_CLI_IMAGE:?missing, pass --env-file deploy/release.env}

  # The audit shipper runs the cli image (Story 1.30), so it takes its digest.
  openbao-audit-shipper:
    <<: *release-image
    image: ${GATEKEEP_CLI_IMAGE:?missing, pass --env-file deploy/release.env}

  # The setup tools run from the OpenBao image, so they take its digest too.
  keygen:
    pull_policy: missing
    image: ${GATEKEEP_OPENBAO_IMAGE:?missing, pass --env-file deploy/release.env}

  openbao-setup:
    pull_policy: missing
    image: ${GATEKEEP_OPENBAO_IMAGE:?missing, pass --env-file deploy/release.env}

  # Checks every image in release.env before anything is deployed (deploy/release/verify.sh).
  release-verify:
    image: ${GATEKEEP_RELEASE_TOOLS_IMAGE:?missing, pass --env-file deploy/release.env}
    pull_policy: missing
    profiles: [release]
    user: "10010:10010"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: "no"
    entrypoint: ["sh", "/opt/gatekeep/release/verify.sh"]
    environment:
      GATEKEEP_OPENBAO_IMAGE: ${GATEKEEP_OPENBAO_IMAGE:?missing, pass --env-file deploy/release.env}
      GATEKEEP_HOSTED_IMAGE: ${GATEKEEP_HOSTED_IMAGE:?missing, pass --env-file deploy/release.env}
      GATEKEEP_ADMIN_IMAGE: ${GATEKEEP_ADMIN_IMAGE:?missing, pass --env-file deploy/release.env}
      GATEKEEP_WORKER_IMAGE: ${GATEKEEP_WORKER_IMAGE:?missing, pass --env-file deploy/release.env}
      GATEKEEP_CADDY_IMAGE: ${GATEKEEP_CADDY_IMAGE:?missing, pass --env-file deploy/release.env}
      GATEKEEP_CLI_IMAGE: ${GATEKEEP_CLI_IMAGE:?missing, pass --env-file deploy/release.env}
      GATEKEEP_RELEASE_TOOLS_IMAGE: ${GATEKEEP_RELEASE_TOOLS_IMAGE:?missing, pass --env-file deploy/release.env}
    volumes:
      - type: bind
        source: ${GATEKEEP_TRUST_DIR:-./trust}/release-signing.pub
        target: /trust/release-signing.pub
        read_only: true
        bind:
          create_host_path: false
    networks: [registry]

networks:
  # Egress for release-verify alone, to pull signatures from the registry.
  registry: {}
