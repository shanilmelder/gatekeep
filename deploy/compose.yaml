# Gatekeep: the whole Deployment as one Compose project (AD-26). Every Gatekeep process
# runs here, OpenBao included. docs/install.md has the steps; in short:
#
#   docker compose -f deploy/compose.yaml --profile tools --profile setup build
#   docker compose -f deploy/compose.yaml run --rm keygen
#   docker compose -f deploy/compose.yaml run --rm passwords
#   docker compose -f deploy/compose.yaml run --rm bootstrap-dir
#   docker compose -f deploy/compose.yaml up -d openbao
#   docker compose -f deploy/compose.yaml run --rm openbao-setup
#   docker compose -f deploy/compose.yaml run --rm cli migrate
#   docker compose -f deploy/compose.yaml up -d --wait
#   docker compose -f deploy/compose.yaml run --rm cli init
#
# Secrets live in GATEKEEP_SECRETS_DIR (default deploy/secrets, resolved against this
# file's directory), a directory on the Docker host that is never a Docker volume, never
# committed and never backed up. Its subdirectories are master/ (the Master Key),
# postgres/ (database passwords), recovery/ (OpenBao recovery keys, until escrowed),
# approle/ (each role's AppRole IDs), bootstrap/ (the one-time bootstrap token, which
# only the cli service mounts), alerts/ (the alert channel's token) and records/ (the
# off-server bucket's write-only credential), the last two written by the Operator. Secrets reach containers only as Compose secrets under
# /run/secrets, but for that token, which cli writes. No secret is in this file, an image or
# an environment variable.
#
# caddy is the only service that publishes ports, 80 and 443 (Story 1.11). It serves the
# Tenant zone wildcard to Host.Hosted and the Admin hostname to Host.Admin, and refuses
# every other name (deploy/caddy/Caddyfile). Only its edge network reaches outside; every
# other network is internal. Host.Hosted, Host.Admin and Host.Worker each have their own
# network and share only PostgreSQL, and hosted-edge and admin-edge each hold one host and
# Caddy, which refuses each site to requests from the other host's edge subnet, so Hosted
# has no route to Admin, directly or through Caddy (AD-2). Health ports listen on loopback
# only.
#
# Application egress (Story 1.30): only worker, cli and openbao-audit-shipper join the egress
# network, and every request they send goes through EgressHttp, which refuses private
# addresses. Host.Admin and Host.Hosted have none. The alert channel and the bucket are set in
# deploy/.env (GATEKEEP_ALERT_URL, GATEKEEP_RECORDS_*), with their secrets in alerts/ and
# records/; Host.Worker refuses to start without them (docs/install.md).
#
# Production TLS for both sites adds deploy/compose.cloudflare.yaml (docs/install.md). A
# Master Key rotation adds deploy/compose.rotate.yaml for its duration only
# (docs/runbooks/master-key-rotation.md).

name: gatekeep

# Every service: bounded processes, and rotated logs so a crash loop can't fill the disk.
x-limits: &limits
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-hardened: &hardened
  <<: *limits
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=16m,mode=1777"]

x-host-healthcheck: &host-healthcheck
  interval: 10s
  timeout: 8s
  retries: 3
  start_period: 60s
  start_interval: 2s

x-host: &host
  <<: *hardened
  restart: unless-stopped
  # The gatekeep-custody group, which owns OpenBao's socket.
  group_add: ["4500"]
  depends_on:
    postgres:
      condition: service_healthy
    postgres-passwords:
      condition: service_completed_successfully
    openbao:
      condition: service_healthy

# The off-server bucket (Story 1.30), for the cli and the shipper. Host.Worker reads the same
# values under its own names.
x-records-environment: &records-environment
  GATEKEEP_RECORDS_ENDPOINT: ${GATEKEEP_RECORDS_ENDPOINT:-}
  GATEKEEP_RECORDS_REGION: ${GATEKEEP_RECORDS_REGION:-}
  GATEKEEP_RECORDS_BUCKET: ${GATEKEEP_RECORDS_BUCKET:-}
  GATEKEEP_RECORDS_ACCESS_KEY_ID_FILE: /run/secrets/records_access_key_id
  GATEKEEP_RECORDS_SECRET_ACCESS_KEY_FILE: /run/secrets/records_secret_access_key

# One-shot tools that write into the secrets directory. Root, for chown into it, with
# only the capabilities that needs, and no network. Each mounts only the subdirectory
# it writes, so none of them can read the Master Key but keygen.
x-secrets-tool: &secrets-tool
  <<: *limits
  read_only: true
  network_mode: none
  user: "0:0"
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
  security_opt: ["no-new-privileges:true"]
  restart: "no"

services:
  postgres:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    <<: *hardened
    pids_limit: 512
    user: "999:999"
    tmpfs: ["/tmp:size=16m,mode=1777", "/var/run/postgresql:size=1m,mode=1777"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: gatekeep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: &role-password-secrets
      - postgres_password
      - gk_migrator_password
      - gk_hosted_password
      - gk_admin_password
      - gk_worker_password
      - gk_dispatch_password
      - gk_sealer_password
      - gk_retention_password
      - gk_cli_password
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      - ./postgres/role-passwords.sh:/docker-entrypoint-initdb.d/20-role-passwords.sh:ro
    networks: [hosted, admin, worker, tools]
    healthcheck:
      # Over tcp: the entrypoint's temporary init server listens on the unix socket only,
      # so this passes only once init has finished and the real server is up.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=gatekeep"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Sets every login role's password from its file, on each `up`, so a password file
  # changed or restored later can't drift from the database. Hosts start after it.
  postgres-passwords:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    <<: *hardened
    user: "999:999"
    restart: "no"
    entrypoint: ["sh", "/gatekeep/role-passwords.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: gatekeep
      GATEKEEP_SUPERUSER_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: *role-password-secrets
    volumes:
      - ./postgres/role-passwords.sh:/gatekeep/role-passwords.sh:ro
    networks: [tools]
    depends_on:
      postgres:
        condition: service_healthy

  openbao:
    build:
      context: ..
      dockerfile: deploy/docker/openbao.Dockerfile
    image: gatekeep/openbao:local
    <<: *hardened
    user: "100:1000"
    # gatekeep-custody, which owns the socket, and openbao-audit, which alone may read the audit
    # file: start-openbao.sh gives the file and its directory that group (Story 1.30).
    group_add: ["4500", "4501"]
    restart: unless-stopped
    # No network at all: hosts reach it only on its socket, on the openbao-socket volume.
    network_mode: none
    # The Master Key and its ID only. The image's start-openbao.sh renders the server config
    # from them onto the /tmp tmpfs, and refuses to start without a valid ID.
    secrets:
      - master_key
      - master_key_id
    volumes:
      - openbao-data:/var/lib/openbao
      - openbao-socket:/run/openbao
      - openbao-audit:/var/log/openbao
    healthcheck:
      # 0 only when initialized and unsealed: before openbao-setup it stays unhealthy.
      test: ["CMD", "bao", "status", "-address=unix:///run/openbao/openbao.sock"]
      interval: 5s
      timeout: 5s
      retries: 12

  hosted:
    build:
      context: ..
      dockerfile: deploy/docker/hosted.Dockerfile
    image: gatekeep/hosted:local
    <<: *host
    user: "10001:10001"
    environment:
      ConnectionStrings__Hosted: Host=postgres;Port=5432;Database=gatekeep;Username=gk_hosted;Gss Encryption Mode=Disable
      Custody__SocketPath: /run/openbao/openbao.sock
      Custody__RoleIdFile: /run/secrets/openbao_role_id
      Custody__SecretIdFile: /run/secrets/openbao_secret_id
    secrets:
      - source: gk_hosted_password
        target: Database__Hosted__Password
      - source: openbao_hosted_role_id
        target: openbao_role_id
      - source: openbao_hosted_secret_id
        target: openbao_secret_id
    volumes:
      - openbao-socket:/run/openbao:ro
    networks: [hosted, hosted-edge]
    healthcheck:
      <<: *host-healthcheck
      test: ["CMD", "dotnet", "/app/Gatekeep.Host.Hosted.dll", "--health-probe"]

  admin:
    build:
      context: ..
      dockerfile: deploy/docker/admin.Dockerfile
    image: gatekeep/admin:local
    <<: *host
    user: "10002:10002"
    environment:
      ConnectionStrings__Admin: Host=postgres;Port=5432;Database=gatekeep;Username=gk_admin;Gss Encryption Mode=Disable
      # The origin browsers reach the Admin Dashboard at, through Caddy: every state-changing
      # request's Origin must be exactly this (Story 1.21). The default port 443 is left out.
      Gatekeep__PublicOrigin: https://${GATEKEEP_ADMIN_HOST:-admin.gatekeep-admin.localhost}:${GATEKEEP_HTTPS_PORT:-443}
      # Caddy's admin-edge subnet: the X-Forwarded-For it sets is believed from there only, so
      # bootstrap claims are counted by the client's address (Story 1.21).
      Gatekeep__ForwardedBy: 10.201.2.0/24
      # The Tenant zone and the HTTPS port Tenant hosts are reached on, the same Caddy serves:
      # a new Tenant's issuer, RP ID and email link base are derived from them once and stored (Story 1.27).
      Gatekeep__TenantZone: ${GATEKEEP_TENANT_ZONE:-gatekeep.localhost}
      Gatekeep__TenantHttpsPort: ${GATEKEEP_HTTPS_PORT:-443}
      Custody__SocketPath: /run/openbao/openbao.sock
      Custody__RoleIdFile: /run/secrets/openbao_role_id
      Custody__SecretIdFile: /run/secrets/openbao_secret_id
    secrets:
      - source: gk_admin_password
        target: Database__Admin__Password
      - source: openbao_admin_role_id
        target: openbao_role_id
      - source: openbao_admin_secret_id
        target: openbao_secret_id
    volumes:
      - openbao-socket:/run/openbao:ro
    networks: [admin, admin-edge]
    healthcheck:
      <<: *host-healthcheck
      test: ["CMD", "dotnet", "/app/Gatekeep.Host.Admin.dll", "--health-probe"]

  worker:
    build:
      context: ..
      dockerfile: deploy/docker/worker.Dockerfile
    image: gatekeep/worker:local
    <<: *host
    user: "10003:10003"
    environment:
      ConnectionStrings__Dispatch: Host=postgres;Port=5432;Database=gatekeep;Username=gk_dispatch;Gss Encryption Mode=Disable
      ConnectionStrings__Worker: Host=postgres;Port=5432;Database=gatekeep;Username=gk_worker;Gss Encryption Mode=Disable
      ConnectionStrings__Sealer: Host=postgres;Port=5432;Database=gatekeep;Username=gk_sealer;Gss Encryption Mode=Disable
      ConnectionStrings__Retention: Host=postgres;Port=5432;Database=gatekeep;Username=gk_retention;Gss Encryption Mode=Disable
      Custody__SocketPath: /run/openbao/openbao.sock
      Custody__RoleIdFile: /run/secrets/openbao_role_id
      Custody__SecretIdFile: /run/secrets/openbao_secret_id
      # The alert channel and the off-server bucket (Story 1.30): required, and refused by name
      # when missing or unsafe, though nothing calls them until Stories 11.1 and 7.2.
      Alerts__Url: ${GATEKEEP_ALERT_URL:-}
      Alerts__TokenFile: /run/secrets/alert_token
      Alerts__Deployment: ${GATEKEEP_ADMIN_HOST:-admin.gatekeep-admin.localhost}
      Records__Endpoint: ${GATEKEEP_RECORDS_ENDPOINT:-}
      Records__Region: ${GATEKEEP_RECORDS_REGION:-}
      Records__Bucket: ${GATEKEEP_RECORDS_BUCKET:-}
      Records__AccessKeyIdFile: /run/secrets/records_access_key_id
      Records__SecretAccessKeyFile: /run/secrets/records_secret_access_key
    secrets:
      - source: gk_dispatch_password
        target: Database__Dispatch__Password
      - source: gk_worker_password
        target: Database__Worker__Password
      - source: gk_sealer_password
        target: Database__Sealer__Password
      - source: gk_retention_password
        target: Database__Retention__Password
      - source: openbao_worker_role_id
        target: openbao_role_id
      - source: openbao_worker_secret_id
        target: openbao_secret_id
      - alert_token
      - records_access_key_id
      - records_secret_access_key
    volumes:
      - openbao-socket:/run/openbao:ro
    # egress reaches the alert channel and the bucket, through EgressHttp only (Story 1.30).
    networks: [worker, egress]
    healthcheck:
      <<: *host-healthcheck
      test: ["CMD", "dotnet", "/app/Gatekeep.Host.Worker.dll", "--health-probe"]

  # The only entry point. The zone and the Admin hostname are settings, not code; the
  # defaults are for local runs and CI. The Admin hostname must be outside the zone, or
  # Caddy refuses to start. Inside, Caddy listens on 8080 and 8443, so it needs
  # no capability; the host ports default to 80 and 443.
  caddy:
    build:
      context: ..
      dockerfile: deploy/docker/caddy.Dockerfile
    image: gatekeep/caddy:local
    <<: *hardened
    user: "10005:10005"
    restart: unless-stopped
    environment:
      GATEKEEP_TENANT_ZONE: ${GATEKEEP_TENANT_ZONE:-gatekeep.localhost}
      GATEKEEP_ADMIN_HOST: ${GATEKEEP_ADMIN_HOST:-admin.gatekeep-admin.localhost}
      # Only deploy/compose.cloudflare.yaml switches the mode; .env can't.
      GATEKEEP_TLS_MODE: internal
    ports:
      - "${GATEKEEP_HTTP_PORT:-80}:8080"
      - "${GATEKEEP_HTTPS_PORT:-443}:8443"
    # Certificates and their private keys (and the internal CA) live only here, mounted by
    # no other service.
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, hosted-edge, admin-edge]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8443"]
      interval: 5s
      timeout: 3s
      retries: 12

  # gatekeep, run on demand: docker compose -f deploy/compose.yaml run --rm cli <command>.
  # A bare `migrate` (as gk_migrator), `audit verify` and `init` (as gk_cli) take their
  # connection and password files from the environment below. `init` also reaches OpenBao
  # on its socket with the cli AppRole, and writes the one-time bootstrap token into
  # bootstrap/ in the secrets directory, its only bind mount from there (Story 1.19).
  cli:
    build:
      context: ..
      dockerfile: deploy/docker/cli.Dockerfile
    image: gatekeep/cli:local
    profiles: [tools]
    <<: *hardened
    user: "10004:10004"
    group_add: ["4500"]
    restart: "no"
    environment:
      GATEKEEP_MIGRATE_CONNECTION_FILE: /gatekeep/migrator.connection
      GATEKEEP_MIGRATE_PASSWORD_FILE: /run/secrets/gk_migrator_password
      GATEKEEP_CLI_CONNECTION_FILE: /gatekeep/cli.connection
      GATEKEEP_CLI_PASSWORD_FILE: /run/secrets/gk_cli_password
      GATEKEEP_CUSTODY_SOCKET: /run/openbao/openbao.sock
      GATEKEEP_CUSTODY_ROLE_ID_FILE: /run/secrets/openbao_role_id
      GATEKEEP_CUSTODY_SECRET_ID_FILE: /run/secrets/openbao_secret_id
      # alerts test and records test (Story 1.30).
      GATEKEEP_ALERT_URL: ${GATEKEEP_ALERT_URL:-}
      GATEKEEP_ALERT_TOKEN_FILE: /run/secrets/alert_token
      GATEKEEP_ALERT_DEPLOYMENT: ${GATEKEEP_ADMIN_HOST:-admin.gatekeep-admin.localhost}
      <<: *records-environment
    secrets:
      - gk_migrator_password
      - gk_cli_password
      - source: openbao_cli_role_id
        target: openbao_role_id
      - source: openbao_cli_secret_id
        target: openbao_secret_id
      - alert_token
      - records_access_key_id
      - records_secret_access_key
    volumes:
      - ./postgres/migrator.connection:/gatekeep/migrator.connection:ro
      - ./postgres/cli.connection:/gatekeep/cli.connection:ro
      - openbao-socket:/run/openbao:ro
      # Read-write: init writes bootstrap-token here, mode 0600, in the 0700 directory
      # bootstrap-dir gives the cli uid. Never in an image, a volume or a backup.
      # Never created here: Docker would make it root-owned, and init would refuse it.
      - type: bind
        source: ${GATEKEEP_SECRETS_DIR:-./secrets}/bootstrap
        target: /gatekeep/bootstrap
        bind:
          create_host_path: false
    networks: [tools, egress]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-passwords:
        condition: service_completed_successfully

  # Copies what OpenBao appends to its audit file into the Object Lock bucket, within 30 seconds
  # of each write (Story 1.30): gatekeep audit-ship from the cli image, as a uid of its own. It
  # reads the openbao-audit volume read-only, through the openbao-audit group, which no other
  # service has, keeps its read offset on its own volume and reaches only the bucket, over egress.
  # It holds no OpenBao login, so it signs nothing: Object Lock keeps the chunks from erasure.
  openbao-audit-shipper:
    # The cli image, built here too, so a plain `docker compose up --build` has it without the
    # tools profile that the cli service sits behind.
    build:
      context: ..
      dockerfile: deploy/docker/cli.Dockerfile
    image: gatekeep/cli:local
    <<: *hardened
    user: "10006:10006"
    group_add: ["4501"]
    restart: unless-stopped
    command: ["audit-ship"]
    environment:
      <<: *records-environment
      GATEKEEP_AUDIT_LOG_FILE: /var/log/openbao/audit.log
      GATEKEEP_AUDIT_SHIP_STATE_DIR: /var/lib/gatekeep/audit-ship
    secrets:
      - records_access_key_id
      - records_secret_access_key
    volumes:
      - openbao-audit:/var/log/openbao:ro
      - shipper-state:/var/lib/gatekeep/audit-ship
    networks: [egress]

  # Writes a new Master Key, generation 1, and its ID into master/. Refuses to replace either.
  keygen:
    image: gatekeep/openbao:local
    profiles: [setup]
    <<: *secrets-tool
    entrypoint: ["sh", "/opt/gatekeep/openbao/generate-master-key.sh"]
    volumes:
      - ${GATEKEEP_SECRETS_DIR:-./secrets}/master:/secrets

  # Writes any missing PostgreSQL password into postgres/.
  passwords:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    profiles: [setup]
    <<: *secrets-tool
    entrypoint: ["sh", "/gatekeep/generate-passwords.sh"]
    volumes:
      - ${GATEKEEP_SECRETS_DIR:-./secrets}/postgres:/secrets/postgres
      - ./postgres/generate-passwords.sh:/gatekeep/generate-passwords.sh:ro

  # Makes bootstrap/, where `cli init` writes the bootstrap token: mode 0700, owned by the
  # cli uid, so on the host only root and that uid can read it (Story 1.19). It writes nothing
  # else and sees no other subdirectory.
  bootstrap-dir:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    profiles: [setup]
    <<: *secrets-tool
    entrypoint: ["sh", "/gatekeep/prepare-bootstrap-dir.sh"]
    volumes:
      - ${GATEKEEP_SECRETS_DIR:-./secrets}/bootstrap:/secrets/bootstrap
      - ./cli/prepare-bootstrap-dir.sh:/gatekeep/prepare-bootstrap-dir.sh:ro

  # First setup of OpenBao, once, over its socket. Writes recovery keys into recovery/ and
  # AppRole IDs into approle/ only. It can't see master/ or postgres/.
  openbao-setup:
    image: gatekeep/openbao:local
    profiles: [setup]
    <<: *secrets-tool
    group_add: ["4500"]
    environment:
      HOME: /tmp
      GATEKEEP_ESCROW_FILE: /secrets/recovery/openbao-init.json
      GATEKEEP_APPROLE_DIR: /secrets/approle
    tmpfs: ["/tmp:size=16m,mode=1777"]
    entrypoint: ["sh", "/opt/gatekeep/openbao/setup.sh"]
    volumes:
      - ${GATEKEEP_SECRETS_DIR:-./secrets}/recovery:/secrets/recovery
      - ${GATEKEEP_SECRETS_DIR:-./secrets}/approle:/secrets/approle
      - openbao-socket:/run/openbao

secrets:
  master_key:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/master/master-key
  # The Master Key's ID, gatekeep-master-<N>, beside it: not a secret, but delivered the same way.
  master_key_id:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/master/master-key-id
  postgres_password:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/postgres/postgres_password
  gk_migrator_password:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/postgres/gk_migrator_password
  gk_hosted_password:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/postgres/gk_hosted_password
  gk_admin_password:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/postgres/gk_admin_password
  gk_worker_password:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/postgres/gk_worker_password
  gk_dispatch_password:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/postgres/gk_dispatch_password
  gk_sealer_password:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/postgres/gk_sealer_password
  gk_retention_password:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/postgres/gk_retention_password
  gk_cli_password:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/postgres/gk_cli_password
  openbao_hosted_role_id:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/approle/host-hosted/role-id
  openbao_hosted_secret_id:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/approle/host-hosted/secret-id
  openbao_admin_role_id:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/approle/host-admin/role-id
  openbao_admin_secret_id:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/approle/host-admin/secret-id
  openbao_worker_role_id:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/approle/host-worker/role-id
  openbao_worker_secret_id:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/approle/host-worker/secret-id
  openbao_cli_role_id:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/approle/cli/role-id
  openbao_cli_secret_id:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/approle/cli/secret-id
  # The alert channel's bearer token and the bucket's write-only credential, written by the
  # Operator (docs/install.md, "Alert channel and off-server bucket").
  alert_token:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/alerts/token
  records_access_key_id:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/records/access-key-id
  records_secret_access_key:
    file: ${GATEKEEP_SECRETS_DIR:-./secrets}/records/secret-access-key

volumes:
  postgres-data:
  openbao-data:
  openbao-socket:
  openbao-audit:
  # The shipper's read offset into the audit file (Story 1.30).
  shipper-state:
  caddy-data:
  caddy-config:

networks:
  hosted:
    internal: true
  admin:
    internal: true
  worker:
    internal: true
  tools:
    internal: true
  # Caddy's published ports, and its ACME and Cloudflare API traffic in cloudflare mode.
  edge: {}
  # Application egress (Story 1.30): worker, cli and openbao-audit-shipper, to the alert channel
  # and the bucket, every request through EgressHttp. Not internal, and holding no PostgreSQL,
  # OpenBao or edge service.
  egress: {}
  # Caddy to Host.Hosted, and nothing else. The subnets are fixed because the Caddyfile
  # refuses each site to requests from the other host's edge subnet.
  hosted-edge:
    internal: true
    ipam:
      config:
        - subnet: 10.201.1.0/24
  # Caddy to Host.Admin, and nothing else.
  admin-edge:
    internal: true
    ipam:
      config:
        - subnet: 10.201.2.0/24
