# Test-only containers, never part of the stack (AD-26): a machine needs only Docker and Git.
#
#   docker compose -f deploy/compose.test.yaml run --rm --build tests
#       The whole .NET build and both test suites.
#
#   docker compose -f deploy/compose.test.yaml run --rm --build stack
#       Installs the stack from deploy/compose.yaml and checks it (deploy/ci/stack-check.sh).
#
#   docker compose -f deploy/compose.test.yaml run --rm --build release
#       Rehearses the signed release path with a throwaway key and a local registry
#       (deploy/ci/release-check.sh).
#
# These are the only services that get the Docker socket: Testcontainers starts PostgreSQL
# and OpenBao beside the tests, the stack check drives Compose, and the release rehearsal
# drives buildx and a registry. That makes them equal to root on the machine they run on,
# so they run only code from this repository.

name: gatekeep-tests

x-test: &test
  build:
    context: ..
    dockerfile: deploy/docker/tests.Dockerfile
  image: gatekeep/tests:local
  pids_limit: 2048
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  tests:
    <<: *test
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Containers Testcontainers starts are siblings, reached through the Docker host.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  stack:
    <<: *test
    profiles: [stack]
    # The repository at the same path it has on the Docker host, because the Compose it
    # drives sends bind mount paths to the Docker engine, which resolves them on the host.
    # CI sets GATEKEEP_HOST_REPO to the checkout. Docker Desktop on Windows needs the
    # /run/desktop/mnt/host/<drive>/... form of the path.
    working_dir: ${GATEKEEP_HOST_REPO:-/gatekeep-host-repo-unset}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:${GATEKEEP_HOST_REPO:-/gatekeep-host-repo-unset}
    environment:
      GATEKEEP_HOST_REPO: ${GATEKEEP_HOST_REPO:-}
      GATEKEEP_SECRETS_DIR: ${GATEKEEP_SECRETS_DIR:-}
      # The host ports Caddy publishes, 80 and 443 unless set: a machine where they are taken
      # (Windows often holds 80) runs the check on others.
      GATEKEEP_HTTP_PORT: ${GATEKEEP_HTTP_PORT:-}
      GATEKEEP_HTTPS_PORT: ${GATEKEEP_HTTPS_PORT:-}
    entrypoint: ["sh", "deploy/ci/stack-check.sh"]

  release:
    build:
      context: ..
      dockerfile: deploy/docker/release-tools.Dockerfile
    image: gatekeep/release-tools:local
    profiles: [release]
    # Root, to use the Docker socket, which is root on the machine anyway (see above). The
    # same image runs non-root as release-verify in deploy/compose.release.yaml.
    user: "0:0"
    pids_limit: 2048
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The repository, read-only: build.sh sends it to buildx as the build context and
    # writes its archives under /tmp.
    working_dir: /work
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/work:ro
    entrypoint: ["sh", "deploy/ci/release-check.sh"]
