name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Also the NuGet critical audit: a critical advisory is NU1904, which
      # TreatWarningsAsErrors turns into a restore failure naming the package.
      - name: Restore from lockfiles and audit NuGet packages
        run: dotnet restore Gatekeep.slnx --locked-mode

      - name: Install from lockfile with scripts disabled
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit pnpm packages
        run: pnpm audit --audit-level critical

      - name: Build .NET solution
        run: dotnet build Gatekeep.slnx --no-restore

      - name: Build workspaces
        run: pnpm -r build

      - name: Test
        run: dotnet test tests/Architecture --no-build
