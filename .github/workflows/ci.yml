name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Docker only (AD-26): the runner needs nothing but Docker and Git. Every .NET and pnpm
# step runs inside the tests container (deploy/compose.test.yaml).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image build restores from lockfiles in locked mode, which is also the NuGet
      # critical audit: a critical advisory is NU1904, which TreatWarningsAsErrors turns
      # into a restore failure naming the package. pnpm installs with scripts disabled.
      - name: Build the tests image
        run: docker compose -f deploy/compose.test.yaml build tests

      # pnpm audit, the .NET build, the workspace build, and the Architecture and
      # Isolation tests (deploy/docker/run-tests.sh).
      - name: Build and test in the tests container
        run: docker compose -f deploy/compose.test.yaml run --rm tests

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # deploy/ci/stack-check.sh, run in the stack container: installs the stack as
      # docs/install.md says, checks every service healthy, the Master Key in no volume,
      # image or environment, the hardening of each running container, no egress,
      # PostgreSQL and OpenBao stopped and a missing Master Key. Tears everything down.
      - name: Bring the stack up and check it
        env:
          GATEKEEP_HOST_REPO: ${{ github.workspace }}
        run: docker compose -f deploy/compose.test.yaml run --rm --build stack

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # deploy/ci/release-check.sh, run in the release container: the release scripts end
      # to end with a throwaway key and a local registry (build, publish, verify), then each
      # refusal: unsigned digest, another key, a tag reference, no pinned key, a software key
      # outside the rehearsal and a drifted digest. Tears everything down.
      - name: Rehearse the signed release path
        run: docker compose -f deploy/compose.test.yaml run --rm --build release
