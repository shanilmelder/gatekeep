name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that branch's older run, which would only spend
# runner minutes on a superseded commit; runs on main queue instead, so every merge is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Docker only (AD-26): the runner needs nothing but Docker and Git. Every .NET and pnpm
# step runs inside the tests container (deploy/compose.dev.yaml).
#
# The suite runs as parallel jobs, each building its own tests image from a clean checkout:
# checks, architecture, and the Isolation tests in four shards (deploy/docker/run-tests.sh
# <stage>). Together they run exactly what run-tests.sh runs with no argument. The build job
# passes only when every one of them did, so `build` stays the one check for the whole suite.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tests image, its build cache and the Testcontainers images outgrow the hosted
      # runner's free disk, which then crashes the runner itself. The job needs only Docker
      # and Git, so drop the preinstalled toolchains it never uses. Every job that builds
      # the tests image does the same.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules
          docker image prune --all --force
          df -h /

      # The image build restores from lockfiles in locked mode, which is also the NuGet
      # critical audit: a critical advisory is NU1904, which TreatWarningsAsErrors turns
      # into a restore failure naming the package. pnpm installs with scripts disabled.
      - name: Build the tests image
        run: docker compose -f deploy/compose.dev.yaml build tests

      # pnpm audit, the design token drift check, the raw hex lint, the .NET build, the
      # API contract, the workspace build, the bundle budget and the browser tests.
      - name: Checks and browser tests in the tests container
        run: docker compose -f deploy/compose.dev.yaml run --rm tests sh deploy/docker/run-tests.sh checks

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules
          docker image prune --all --force
          df -h /

      - name: Build the tests image
        run: docker compose -f deploy/compose.dev.yaml build tests

      # The .NET build, then the Architecture tests.
      - name: Architecture tests in the tests container
        run: docker compose -f deploy/compose.dev.yaml run --rm tests sh deploy/docker/run-tests.sh architecture

  isolation:
    name: isolation (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard runs to the end, so one run shows every failing test.
      fail-fast: false
      matrix:
        # 1..ISOLATION_SHARDS of deploy/docker/run-tests.sh, which refuses any other count.
        # Shards 1 to 3 name their namespaces there; shard 4 runs every other test.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules
          docker image prune --all --force
          df -h /

      - name: Build the tests image
        run: docker compose -f deploy/compose.dev.yaml build tests

      # The .NET and workspace builds, a check of the shard layout against the discovered
      # tests, then this shard's Isolation tests against Testcontainers PostgreSQL, OpenBao
      # and MinIO.
      - name: Isolation tests in the tests container
        run: docker compose -f deploy/compose.dev.yaml run --rm tests sh deploy/docker/run-tests.sh isolation ${{ matrix.shard }}/4

  # The one check for the whole suite: green only when every job above succeeded (a
  # failed, cancelled or skipped one fails it).
  build:
    if: always()
    needs: [checks, architecture, isolation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "checks, architecture, isolation: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done


  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # deploy/ci/stack-check.sh, run in the stack container: installs the stack as
      # docs/install.md says, checks every service healthy, the Master Key in no volume,
      # image or environment, the hardening of each running container, no egress,
      # PostgreSQL and OpenBao stopped and a missing Master Key. Tears everything down.
      - name: Bring the stack up and check it
        env:
          GATEKEEP_HOST_REPO: ${{ github.workspace }}
        run: docker compose -f deploy/compose.dev.yaml run --rm --build stack


  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # deploy/ci/release-check.sh, run in the release container: the release scripts end
      # to end with a throwaway key and a local registry (build, publish, verify), then each
      # refusal: unsigned digest, another key, a tag reference, no pinned key, a software key
      # outside the rehearsal, an env:// key with no password or no key, and a drifted
      # digest. Signs with an encrypted env:// key, as the sign job does. Tears everything down.
      - name: Rehearse the signed release path
        run: docker compose -f deploy/compose.dev.yaml run --rm --build release
