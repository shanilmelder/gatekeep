name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One self-hosted runner serves every job, so a superseded run only holds up the queue. A new
# push to a pull request cancels that branch's older run; runs on main queue instead, so every
# merge is still checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Docker only (AD-26): the runner needs nothing but Docker and Git. Every .NET and pnpm
# step runs inside the tests container (deploy/compose.dev.yaml).
jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tests image, its build cache and the Testcontainers images outgrow the hosted
      # runner's free disk, which then crashes the runner itself. The job needs only Docker
      # and Git, so drop the preinstalled toolchains it never uses.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules
          # On the self-hosted runner a build killed mid-way can leave a dangling BuildKit
          # lease that makes the prune fail; a failed prune only means less space freed.
          docker image prune --all --force || echo "image prune failed; continuing."
          df -h /

      # The image build restores from lockfiles in locked mode, which is also the NuGet
      # critical audit: a critical advisory is NU1904, which TreatWarningsAsErrors turns
      # into a restore failure naming the package. pnpm installs with scripts disabled.
      - name: Build the tests image
        run: docker compose -f deploy/compose.dev.yaml build tests

      # pnpm audit, the design token drift check, the raw hex lint, the .NET build, the
      # workspace build, the browser tests, and the Architecture and Isolation tests
      # (deploy/docker/run-tests.sh).
      - name: Build and test in the tests container
        run: docker compose -f deploy/compose.dev.yaml run --rm tests

      # A cancelled job kills only the compose client, so the one-off tests container keeps
      # running and holds the gatekeep-dev project for the next run. Remove it either way.
      - name: Remove leftover tests containers
        if: always()
        run: |
          docker ps -aq --filter label=com.docker.compose.project=gatekeep-dev --filter label=com.docker.compose.service=tests | xargs -r docker rm -f

  stack:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # deploy/ci/stack-check.sh, run in the stack container: installs the stack as
      # docs/install.md says, checks every service healthy, the Master Key in no volume,
      # image or environment, the hardening of each running container, no egress,
      # PostgreSQL and OpenBao stopped and a missing Master Key. Tears everything down.
      - name: Bring the stack up and check it
        env:
          GATEKEEP_HOST_REPO: ${{ github.workspace }}
        run: docker compose -f deploy/compose.dev.yaml run --rm --build stack

      # A cancelled job kills only the compose client, so the one-off stack container keeps
      # running and holds the gatekeep-dev project for the next run. Remove it either way.
      - name: Remove leftover stack containers
        if: always()
        run: |
          docker ps -aq --filter label=com.docker.compose.project=gatekeep-dev --filter label=com.docker.compose.service=stack | xargs -r docker rm -f
          # The stack the check installs, under its own project, with its volumes.
          docker ps -aq --filter label=com.docker.compose.project=gatekeep-stack-check | xargs -r docker rm -f
          docker volume ls -q --filter label=com.docker.compose.project=gatekeep-stack-check | xargs -r docker volume rm

  release:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # deploy/ci/release-check.sh, run in the release container: the release scripts end
      # to end with a throwaway key and a local registry (build, publish, verify), then each
      # refusal: unsigned digest, another key, a tag reference, no pinned key, a software key
      # outside the rehearsal, an env:// key with no password or no key, and a drifted
      # digest. Signs with an encrypted env:// key, as the sign job does. Tears everything down.
      - name: Rehearse the signed release path
        run: docker compose -f deploy/compose.dev.yaml run --rm --build release

      # A cancelled job kills only the compose client, so the one-off release container keeps
      # running and holds the gatekeep-dev project for the next run. Remove it either way.
      - name: Remove leftover release containers
        if: always()
        run: |
          docker ps -aq --filter label=com.docker.compose.project=gatekeep-dev --filter label=com.docker.compose.service=release | xargs -r docker rm -f
